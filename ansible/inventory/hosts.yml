# Инвентарь для Ansible
# После terraform apply заполните app_servers хостами из вывода:
# terraform output -raw ansible_hosts
# Либо используйте динамический inventory (terraform-inventory)

all:
  children:
    app_servers:
      hosts:
        # Пример (замените на IP из terraform output):
        # app1:
        #   ansible_host: 84.201.xxx.xxx
        # app2:
        #   ansible_host: 84.201.xxx.xxx
      vars:
        ansible_user: ubuntu
        app_port: 8000
        app_name: credit-scoring-api
