---
# Роль: развёртывание Credit Scoring API (FastAPI + uvicorn)

- name: Install Python and pip
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true
  tags: app

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"
  tags: app

- name: Copy application code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../"
    dest: "{{ app_dir }}"
    exclude:
      - ".git"
      - "__pycache__"
      - "*.pyc"
      - "terraform"
      - "ansible"
      - ".cursor"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
  tags: app

- name: Create virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ app_dir }}/venv"
    creates: "{{ app_dir }}/venv/bin/python"
  tags: app

- name: Install requirements from file
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    executable: "{{ app_dir }}/venv/bin/pip"
    state: present
  tags: app

- name: Deploy systemd unit
  ansible.builtin.template:
    src: credit-scoring-api.service.j2
    dest: /etc/systemd/system/credit-scoring-api.service
    mode: "0644"
  tags: app

- name: Enable and start Credit Scoring API service
  ansible.builtin.systemd:
    name: credit-scoring-api
    state: started
    enabled: true
    daemon_reload: true
  tags: app

- name: Wait for API health check
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    status_code: 200
  register: health_result
  until: health_result.status == 200
  retries: 12
  delay: 5
  tags: app
