# Вариант 3: с включённым Ingress (манифест Ingress генерируется)
# Использование: helm install nginx-ing ./nginx -f nginx/values-with-ingress.yaml -n dev --create-namespace

image:
  repository: nginx
  tag: "1.25"

replicaCount: 1

resources: {}

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: nginx.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

service:
  type: ClusterIP
  port: 80
