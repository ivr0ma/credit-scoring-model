apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-scoring
  labels:
    app: credit-scoring
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credit-scoring
  template:
    metadata:
      labels:
        app: credit-scoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: credit-scoring
          image: credit-scoring:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_VERSION
              value: "1.0.0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: credit-scoring-secrets
                  key: database-url
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
